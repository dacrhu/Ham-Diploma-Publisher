@{layout('layout-nomenu')}

<section class="hero is-fullheight">
	<div class="hero-body">
		<div class="container">
			<div class="columns is-centered">
				<div class="column is-4">
					<div class="box">
						<h1 class="title is-4 has-text-centered">@(#forgot.title)</h1>

						<form id="form_forgot">
							<div class="field">
								<label class="label">@(#forgot.email.label)</label>
								<input class="input" type="email" name="email" required autocomplete="email">
							</div>

							<div class="field mt-4">
								<button class="button is-primary is-fullwidth" type="submit" id="button_forgot">
									<span>@(#forgot.submit)</span>
								</button>
							</div>
						</form>

						<div class="notification is-info is-hidden" id="notification_sent">@(#forgot.sent.text)</div>

						<p class="has-text-centered mt-3">
							<a href="/login">@(#forgot.back.link)</a>
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

@{import('frontendhelper.js + common.js')}
@{import('pages/forgot-password/10_submit.js')}

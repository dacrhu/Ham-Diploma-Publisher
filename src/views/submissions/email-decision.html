<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<style>
		body { font-family: Arial, sans-serif; color: #333; }
		.btn { display: inline-block; padding: 10px 20px; background-color: #3273dc; color: #fff; text-decoration: none; border-radius: 4px; }
	</style>
</head>
<body>
	<p>@{model.greeting} @{model.name},</p>
	<p>@{model.intro}</p>
	@{if model.remark}
	<p><strong>@{model.remark_label}:</strong> @{model.remark}</p>
	@{fi}
	<p><a class="btn" href="@{model.submission_link}">@{model.btn_label}</a></p>
	<hr>
	<small>@{model.footer}</small>
</body>
</html>
